spring:
  neo4j:
    uri: bolt://localhost:7687
    authentication:
      username: neo4j
      password: password123
  application:
    name: ragagentic-platform
  data:
    redis:
      host: localhost
      port: 6379
      timeout: 60000

      lettuce:
        pool:
          max-active: 10
          max-idle: 10
          min-idle: 2
  mvc:
   async:
     request-timeout: 300000
  ai:
    ollama:
      base-url: http://localhost:11434
      chat:
        options:
          model: llama3.2:latest
          temperature: 0
      embedding:
        model: nomic-embed-text
    vectorstore:
      qdrant:
        host: localhost
        port: 6334
        collection-name: enterprise-docs
        initialize-schema: true
        initialize-collection: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics

  endpoint:
    prometheus:
      enabled: true

  metrics:
    tags:
      application: ragagentic-platform
  tracing:
    enabled: true

    sampling:
      probability: 1.0
  otlp:
    tracing:
      endpoint: http://localhost:4318/v1/traces
# Enterprise RAG Configuration Parameters
rag:
  top-k: 5
  similarity-threshold: 0.75

metrics:
  tags:
    application: ragagentic-platform